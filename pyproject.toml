[project]
name = "competitive-search-bot"
version = "0.1.0"
description = "Telegram bot for searching for information from various sources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "aiolimiter>=1.3.0",
    "cachetools>=7.2.0",
    "limits>=5.8.0",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
